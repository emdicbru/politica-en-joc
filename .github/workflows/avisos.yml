name: Desplega el servei d'avisos
# Desplega worker/ (avisos de missatges i trucades entre amics) a Cloudflare Workers i hi posa els secrets.
# Les claus no surten mai de GitHub: FIREBASE_SA, VAPID_PUBLIC i VAPID_PRIVATE són les mateixes que fa servir push.yml.
# Cal tenir a GitHub els secrets CLOUDFLARE_API_TOKEN (plantilla «Edit Cloudflare Workers») i CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/avisos.yml"]
concurrency:
  group: avisos
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Comprova els secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Falten CLOUDFLARE_API_TOKEN i CLOUDFLARE_ACCOUNT_ID"; exit 1; fi
      - name: Comprova el token de Cloudflare
        working-directory: worker
        run: |
          npx --yes wrangler@3.90.0 whoami > whoami.txt 2>&1 || { echo "::error title=Token de Cloudflare::$(grep -v '^\s*$' whoami.txt | tail -6 | tr '\n' ' ' | cut -c1-900)"; exit 1; }
      - name: Desplega el Worker
        working-directory: worker
        # Si falla, l'error surt com a anotació (es pot llegir sense entrar al registre)
        run: |
          npx --yes wrangler@3.90.0 deploy > deploy.txt 2>&1 || { echo "::error title=Desplegament::$(grep -v '^\s*$' deploy.txt | tail -8 | tr '\n' ' ' | cut -c1-900)"; exit 1; }
          grep -o 'https://[a-z0-9.-]*workers.dev' deploy.txt | head -1 | sed 's/^/::notice title=Adreça del servei::/'
      - name: Posa els secrets al Worker
        working-directory: worker
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: |
          printf '%s' "$FIREBASE_SA" | npx --yes wrangler@3.90.0 secret put FIREBASE_SA
          printf '%s' "$VAPID_PUBLIC" | npx --yes wrangler@3.90.0 secret put VAPID_PUBLIC
          printf '%s' "$VAPID_PRIVATE" | npx --yes wrangler@3.90.0 secret put VAPID_PRIVATE
      - name: Token per despertar les notificacions al minut (opcional)
        working-directory: worker
        env:
          GH_DISPATCH: ${{ secrets.GH_DISPATCH }}
        run: |
          if [ -n "$GH_DISPATCH" ]; then printf '%s' "$GH_DISPATCH" | npx --yes wrangler@3.90.0 secret put GH_DISPATCH; else echo "Sense GH_DISPATCH: les notificacions surten cada 5 minuts (push.yml)"; fi
