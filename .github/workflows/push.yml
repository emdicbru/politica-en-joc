name: Envia les notificacions
# Cada 5 minuts (el repositori és públic: GitHub Actions no té cost) i a l'instant des del Centre de control.
# Necessita els secrets FIREBASE_SA (clau de servei de Firebase en JSON), VAPID_PUBLIC i VAPID_PRIVATE
# (els desa tools/push-setup.js). Sense els secrets no fa res.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: push
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12 web-push@3
      - run: node tools/push.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
