name: Genera el quiz de l'actualitat
# Un cop al dia, amb la IA de Cloudflare a través del servei d'avisos (tools/ia.js; sense claus: testimoni OIDC).
# El repositori és públic, així que GitHub Actions tampoc no té cost. Si s'arriba al límit gratuït, simplement no genera res.
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
  # També quan canvia el generador, per provar-lo de seguida
  push:
    branches: [main]
    paths: ["tools/update-quiz.js", "tools/ia.js"]
permissions:
  contents: write
  id-token: write
jobs:
  quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/update-quiz.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Desa el quiz si ha canviat
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/quiz.json
          git diff --staged --quiet && exit 0
          git commit -m "Quiz de l'actualitat"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
